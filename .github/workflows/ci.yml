name: CI

on:
  push:
  pull_request:

env:
  # The ferron-lang/ferron release tag (`vX.Y.Z-alpha.N`) or commit this
  # package is tested with; move it together with the `ferron` requirement
  # in anvil.toml.
  FERRON_REF: v0.6.0-alpha.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: ferron-lang/ferron
          ref: ${{ env.FERRON_REF }}
          # ferron-lang/ferron is private; README.md names the secret.
          token: ${{ secrets.FERRON_REPO_TOKEN }}
          path: .ferron
      - name: Install SQLite and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev clang
          dpkg-query -W libsqlite3-dev
      - name: Build anvil
        working-directory: .ferron
        run: |
          cargo build --release -p anvil-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: anvil check
      - run: anvil test
      - run: anvil fmt --check
      # Last: on a mismatch it regenerates src/sys/ to show the difference.
      - name: anvil ffi gen --check
        run: anvil ffi gen --check || { anvil ffi gen; git diff; exit 1; }
